# ============================================================
# 全能AI · iOS 出包 workflow
#
# 这个文件解决三件在真机上验证过会失败的事，逐条写清楚，免得以后
# 有人「顺手改回去」又踩一遍：
#
# 1. runner 必须是 macos-26（理由不是部署目标，别搞混）
#    主 App target 的 IPHONEOS_DEPLOYMENT_TARGET 其实是 **16.0**
#    （扩展 16.0 / Widget 16.2，只有 MinisTests 和 MinisUITests 是 26.2）。
#    部署目标低不等于能用旧 SDK 编 —— 代码里有大量
#    `@available(iOS 26.0, *)` 分支，并且直接引用了 iOS 26 才有的
#    框架符号（AlarmKit 的 alarmkit_is_usable、BackgroundAssets 的
#    BGContinuedProcessingTask 等）。这些**声明**来自 SDK 头文件，
#    旧 SDK 里压根不存在，编译期就报 undeclared。
#    所以 macos-26 是为了拿 iOS 26.x SDK，跟部署目标 16.0 不矛盾：
#    部署目标是「最低能装到哪」，SDK 是「用什么编」。
#    macos-14 自带 Xcode 15/16（SDK 18.x），一编就报
#    "building for iOS 16.0, but the SDK is 18.x" 之后还会撞 undeclared。
#
# 2. 原生依赖必须先编，不能跳过
#    Xcode 工程按相对路径引用 deps/libs、deps/include、deps/frameworks、
#    deps/resources。这四样都不在仓库里（都是 .gitignore 掉的构建产物），
#    clone 下来是空的。不先跑 deps/ 下的脚本，链接阶段必然一堆
#    undefined symbol。顺序不能调：FFmpeg 链 LAME，所以 LAME 先。
#
# 3. 必须用 xcrun 取的 iPhoneOS SDK，且不能有 CRLF
#    .gitattributes 已经把 .sh/.swift/.pbxproj 全锁成 LF。Windows 上
#    core.autocrlf=true 检出的 CRLF 会让 shebang 变 `#!/bin/sh^M`。
#    不写死 26.2 这个版本号 —— runner 镜像会升级，写死了反而脆。
#
# 内存：见 Build 步骤里的 -jobs。macos-26 上 xcodebuild 默认按核心数开
#    swift-frontend，十几个一起会 OOM 被杀（日志零 error: 全是 warning）。
#    不要再往 env 里加 SWIFT_ENABLE_EXPLICIT_MODULES=NO，那是反效果。
#
# 产物说明：
#    workflow 用 CODE_SIGNING_ALLOWED=NO 编，产出**未签名**的 .app。
#    这不能直装到 iPhone —— iOS 要求可执行文件有有效签名。
#    自用装机路径：TrollStore 或自签（AltStore/Sideloadly/企业证书）。
#    要出真正可安装的 ipa，需要证书 + provisioning profile，那属于
#    签名环节，不在这里做。
# ============================================================

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '编译配置'
        required: true
        type: choice
        options: [Release, Debug]
        default: Release
      note:
        description: '说明（会写进 artifact 名和 Summary）'
        required: false
        default: ''

  push:
    branches: [main]
    # 这里曾经只写 '.github/workflows/build.yml' 一条，结果是：
    # 改了 Swift / pbxproj 推上去，什么都不跑，还得手动 dispatch 一次。
    # 出包是这个仓库唯一的产出，源码变了就该跑。文档和截图不触发。
    paths:
      - '.github/workflows/build.yml'
      - 'src/ios/**'
      - 'deps/**'
      - 'scripts/**'

# 同一分支只跑一个，新的顶掉旧的 —— macOS runner 按 10 倍计费，
# 排队跑两份等于白烧额度
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS (${{ inputs.configuration || 'Release' }})
    runs-on: macos-26
    timeout-minutes: 120

    env:
      # 用固定的 DerivedData 路径，后面缓存和产物收集都认这个
      DERIVED: ${{ github.workspace }}/build
      CONFIG: ${{ inputs.configuration || 'Release' }}
      # ── 内存控制：两层都得压，只压一层没用 ──
      #
      # 症状（run #15 / #16 实测）：日志里零 error:、全是 warning，然后
      # 蹦出 "Failed frontend command:" 和一行超长的 swift-frontend 命令，
      # 紧接着 ** BUILD FAILED **。这不是代码错，是 swift-frontend 进程
      # 被 OOM killer 干掉了 —— 它连 error 都来不及打印。
      #
      # 为什么单靠 xcodebuild -jobs 不够：
      #   -jobs 控制的是「同时跑几个构建任务」，而一个 SwiftCompile 任务
      #   内部还会按 CPU 核心数再并行起**多个** swift-frontend 进程。
      #   macos-26 runner 是 3–4 核 / 7GB，默认能起十几个 frontend，
      #   每个 1–2GB，必被 OOM。
      #
      # 所以三层一起压：
      #   1. -jobs 4         → 少跑几个构建任务
      #   2. SWIFT_DRIVER_JOBS 2 → 一个编译任务内部只并行 2 个 frontend
      #   3. SWIFT_COMPILATION_MODE=wholemodule → Release 本来就是整模块
      #      编，明确写出来避免增量模式额外驻留一份 AST
      #
      # 不要再加 SWIFT_ENABLE_EXPLICIT_MODULES=NO：它关掉显式模块后
      # 同一个 module 会被重复构建，内存峰值反而更高。
      BUILD_JOBS: 4
      SWIFT_DRIVER_JOBS: 2
      SWIFT_COMPILATION_MODE: wholemodule

    steps:
      # ── 0. 打印环境，失败时日志第一段就能定位是不是环境问题 ──
      - name: Environment
        run: |
          set -x
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          echo "--- runtimes ---"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          echo "--- disk ---"
          df -h /

      # ── 1. 拉代码（含子模块）──
      # deps/ish 和 deps/proot 是 gitlink，必须 recursive，否则拿到空目录
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          # 子模块在上游公共仓库，用默认 token 就够
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify submodules
        run: |
          # 这两个目录空了说明 submodules 没拉到，后面 build_ish.sh 会挂
          for d in deps/ish deps/proot; do
            n=$(ls -A "$d" 2>/dev/null | wc -l | tr -d ' ')
            echo "$d: $n entries"
            if [ "$n" = "0" ]; then
              echo "::error::$d 是空的，submodule 没拉到。检查 .gitmodules 与上游仓库是否可达。"
              exit 1
            fi
          done

      # ── 2. 装工具链 ──
      # runner 预装了 Xcode 26.6 和 ninja，但 Go / meson / libarchive /
      # pkg-config 没有，必须自己装。llvm 用来编 iSH 的 guest VDSO。
      - name: Install toolchain
        run: |
          # lld 必须显式装：deps/ish/vdso/arm64/meson.build 把 -fuse-ld=lld 写死了，
          # 但 homebrew 的 llvm（23.x 起）不再随附 lld，只有 bin/clang。
          # 缺它 → guest VDSO 链接失败 → "invalid linker name in argument '-fuse-ld=lld'"。
          #
          # lld 不是 keg-only，formula 里用 link_overwrite 直接装进
          # /opt/homebrew/bin/{ld.lld,lld}，所以不用额外改 PATH。
          #
          # 注意这里故意不装 go —— 版本必须钉死，见下一步。
          brew install --quiet meson libarchive pkg-config llvm ninja lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          # meson 装到 brew 的 python 里，确保 PATH 能找到
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # Go 版本必须钉死，不能用 brew 的最新版。
      # deps/rclone-mobile/go.mod 声明 go 1.25.5，其中间接依赖
      # go-json-experiment/json 是按 1.25 的 encoding/json 内部 API 写的；
      # 换到 1.27 会直接编译失败：
      #   alias.go:618:21: undefined: json.SkipFunc
      #   alias.go:957:14: undefined: json.DiscardUnknownMembers
      # 装 1.25 分支最新补丁版，既不碰上游 go.mod，也留了安全修复。
      - name: Install Go 1.25.x
        run: |
          set -e
          GO_VER="1.25.14"
          GO_SHA="5b26c0b6f308240fca2614fb02f622cfcc8c0cc3b69c78bba4845489a4590259"
          GO_TARBALL="go${GO_VER}.darwin-arm64.tar.gz"
          GO_ROOT="$RUNNER_TEMP/goroot"

          echo "downloading go${GO_VER}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$GO_TARBALL" \
            "https://go.dev/dl/$GO_TARBALL"

          # 校验 sha256：拿错包 / 被劫持 / 下载截断，这里就拦住
          echo "$GO_SHA  $RUNNER_TEMP/$GO_TARBALL" | shasum -a 256 -c -

          rm -rf "$GO_ROOT"
          mkdir -p "$GO_ROOT"
          tar -C "$GO_ROOT" --strip-components=1 -xzf "$RUNNER_TEMP/$GO_TARBALL"

          "$GO_ROOT/bin/go" version
          echo "$GO_ROOT/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -e
          # GITHUB_PATH 是给后续步骤用的，本步骤里不生效，自己补一次
          export PATH="$RUNNER_TEMP/goroot/bin:$(brew --prefix llvm)/bin:$(brew --prefix)/bin:$PATH"

          go version
          # 挡住 Go 版本又漂回新版 —— 那样 rclone 会以一堆 undefined 报错
          if ! go version | grep -q 'go1\.25\.'; then
            echo "::error::Go 版本不是 1.25.x，rclone 会编译失败（见 Install Go 1.25.x 的注释）"
            exit 1
          fi
          meson --version
          ninja --version
          echo "llvm: $(brew --prefix llvm)"

          # lld 三查：装没装、PATH 里找不找得到、能不能真链出 aarch64 ELF。
          # 只查"文件存在"不够 —— clang 的 -fuse-ld=lld 是按名字在 PATH 里找 ld.lld 的。
          if ! command -v ld.lld >/dev/null 2>&1; then
            echo "::error::PATH 里找不到 ld.lld。VDSO 交叉链接必须要它：brew install lld"
            brew list --versions lld || echo "lld 未安装"
            exit 1
          fi
          echo "ld.lld: $(command -v ld.lld)"
          "$(brew --prefix llvm)/bin/clang" --version | head -1

          # 用 vdso 的真实编译命令做一次最小验证，提前暴露问题而不是等 iSH 那步。
          # 必须真链接（-shared）—— 只 -c 编译不会调用 linker，测不出 lld 缺失。
          printf 'int x;\n' > /tmp/lld_probe.c
          if ! "$(brew --prefix llvm)/bin/clang" -target aarch64-linux-gnu -fuse-ld=lld \
                 -shared -nostdlib -fPIC /tmp/lld_probe.c -o /tmp/lld_probe.so; then
            echo "::error::clang 无法用 -fuse-ld=lld 链接 aarch64-linux-gnu 目标"
            exit 1
          fi
          echo "aarch64-linux-gnu + lld probe: OK"

          xcrun -sdk iphoneos metal --version || {
            echo "::warning::Metal 工具链缺失，FFmpeg 会静默丢掉 yadif_videotoolbox 滤镜"
          }

      # ── 3. 原生依赖缓存 ──
      # 这一套全量编译要 30–50 分钟，不改 deps/ 就没必要重编。
      # key 里带脚本和子模块的 hash，脚本一改自动失效。
      - name: Compute deps cache key
        id: depskey
        run: |
          # h1 = 依赖脚本自身内容的 hash（脚本一改，LAME/FFmpeg 缓存自动失效）
          H1=$(find deps -maxdepth 2 -name 'build_*.sh' -o -maxdepth 2 -name 'prepare_*.sh' | sort | xargs cat 2>/dev/null | shasum -a 256 | cut -d' ' -f1)
          # h2 = 子模块 commit 的 hash（deps/ish 一换，iSH 缓存自动失效）
          H2=$(git ls-tree HEAD deps/ | grep -E '160000' | shasum -a 256 | cut -d' ' -f1)
          echo "h1=$H1" >> "$GITHUB_OUTPUT"
          echo "h2=$H2" >> "$GITHUB_OUTPUT"
          echo "key=deps-$H1-$H2" >> "$GITHUB_OUTPUT"
          echo "h1=$H1"
          echo "h2=$H2"

      # 分片编号：把依赖拆成四个独立缓存，各自 restore / save。
      # 原因：合成一个 key 的话，iSH 挂了整份缓存都不会存，前面 LAME/FFmpeg
      # 白编 20 多分钟。拆开之后谁成功谁落盘，下一轮直接命中。
      - name: Restore LAME cache
        id: c_lame
        uses: actions/cache/restore@v4
        with:
          path: deps/lame-build
          key: lame-${{ steps.depskey.outputs.h1 }}

      # build_ffmpeg.sh 产出的是整个 deps/frameworks 目录：
      #   FFmpeg.framework（伞形）+ libav*/libsw* 各一个 .framework。
      # 工程按 deps/frameworks/FFmpeg.framework/Headers 找头文件，缺一个都编不过。
      - name: Restore FFmpeg cache
        id: c_ff
        uses: actions/cache/restore@v4
        with:
          path: deps/frameworks
          key: ffmpeg-${{ steps.depskey.outputs.h1 }}

      - name: Restore iSH cache
        id: c_ish
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources/RootfsPatch.bundle
          key: ish-v2-${{ steps.depskey.outputs.h2 }}

      # rclone 也写进 deps/frameworks，单独缓存，
      # 否则 FFmpeg 缓存的还原会把 Rclone.xcframework 一起盖掉。
      - name: Restore rclone cache
        id: c_rclone
        uses: actions/cache/restore@v4
        with:
          path: deps/frameworks/Rclone.xcframework
          key: rclone-go1.25-${{ steps.depskey.outputs.h2 }}

      - name: Restore rootfs cache
        id: c_rootfs
        uses: actions/cache/restore@v4
        with:
          path: deps/resources/alpine-rootfs.zip
          key: rootfs-alpine
      
      # ── 4. 构建原生依赖 ──
      # 顺序有依赖关系，不能并行也不能调换：
      #   LAME  →  FFmpeg 要用它编 libmp3lame，没有就静默丢 MP3
      #   iSH   →  产出 libish*.a + headers + VDSO
      #   rootfs→  Alpine，转成 iSH 的 fakefs
      #   rclone→  只要 Go，但要在 FFmpeg 之后（互不依赖，放最后统一收尾）
      # 执行位兜底：Windows 上建的仓，git 未必记下 100755。
      # 放在依赖构建之前统一补一遍，不要散落在各个 build 步骤里 ——
      # 命中缓存时那些步骤根本不执行，chmod 也就跟着被跳过了。
      - name: Fix script exec bits
        run: |
          chmod +x deps/*.sh 2>/dev/null || true
          chmod +x scripts/*.sh 2>/dev/null || true
          chmod +x deps/lame-3.100/configure deps/lame-3.100/install-sh 2>/dev/null || true
          find deps/lame-3.100 -name 'depcomp' -o -name 'config.guess' -o -name 'config.sub' \
               -o -name 'ltmain.sh' -o -name 'missing' -o -name 'compile' 2>/dev/null | xargs chmod +x 2>/dev/null || true
          git ls-files -s deps/build_ish.sh deps/build_lame.sh deps/build_ffmpeg.sh

      # rootfs 资源兜底：deps/resources/ 整体被 gitignore，靠 build_ish.sh 复制。
      # 但 Build iSH 命中缓存时会整个跳过，那一步的复制也就没执行 ——
      # 结果 deps/resources/ 只有 rootfs zip，缺 RootfsPatch.bundle，
      # xcodebuild 编到 CpResource 才报 "couldn't be opened because there is
      # no such file"，前面 30 分钟全白跑。
      # 这里无条件补一次：源在子模块里，复制成本几乎为零。
      - name: Ensure rootfs resources
        run: |
          set -e
          mkdir -p deps/resources

          SRC="deps/ish/app/RootfsPatch.bundle"
          DST="deps/resources/RootfsPatch.bundle"
          if [ -d "$DST" ]; then
            echo "OK   $DST 已存在"
          elif [ -d "$SRC" ]; then
            cp -R "$SRC" "$DST"
            echo "COPIED  $SRC -> $DST"
          else
            echo "::error::$SRC 不存在，工程硬引用这个 bundle，缺了必然编译失败"
            exit 1
          fi

          # 工程里所有 dei/resources 下的硬引用，逐个确认在不在
          for f in deps/resources/alpine-rootfs.zip deps/resources/RootfsPatch.bundle; do
            if [ -e "$f" ]; then
              echo "OK   $f"
            else
              echo "::error::缺 $f —— xcodebuild 会在 CpResource 阶段失败"
              exit 1
            fi
          done

      - name: Build LAME
        if: steps.c_lame.outputs.cache-hit != 'true'
        run: ./deps/build_lame.sh

      - name: Save LAME cache
        if: success() && steps.c_lame.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/lame-build
          key: lame-${{ steps.depskey.outputs.h1 }}

      - name: Build FFmpeg
        if: steps.c_ff.outputs.cache-hit != 'true'
        run: ./deps/build_ffmpeg.sh

      - name: Save FFmpeg cache
        if: success() && steps.c_ff.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/frameworks
          key: ffmpeg-${{ steps.depskey.outputs.h1 }}

      - name: Build iSH
        if: steps.c_ish.outputs.cache-hit != 'true'
        run: ./deps/build_ish.sh

      - name: Save iSH cache
        if: success() && steps.c_ish.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources/RootfsPatch.bundle
          key: ish-v2-${{ steps.depskey.outputs.h2 }}

      - name: Prepare Alpine rootfs
        run: |
          # rootfs 的 key 不带 hash（Alpine 版本写死在脚本里），
          # 但缓存里可能只有半份，所以还要检查 zip 是否真存在。
          if [ -f deps/resources/alpine-rootfs.zip ]; then
            echo "rootfs 已命中缓存，跳过"
            ls -la deps/resources/alpine-rootfs.zip
          else
            ./deps/prepare_alpine_rootfs.sh
          fi

      - name: Save rootfs cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/resources/alpine-rootfs.zip
          key: rootfs-alpine

      - name: Build rclone
        if: steps.c_rclone.outputs.cache-hit != 'true'
        run: ./deps/build_rclone_ios.sh

      # 这里必须是 success() 而不是 always()：构建失败时目录里可能留了
      # 半成品 xcframework，存进缓存会被下一轮当成"已命中"直接复用，
      # 一路错到链接阶段。LAME/FFmpeg/iSH 同理，见各自 save 步骤。
      - name: Save rclone cache
        if: success() && steps.c_rclone.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/frameworks/Rclone.xcframework
          key: rclone-go1.25-${{ steps.depskey.outputs.h2 }}

      - name: Verify native deps
        run: |
          fail=0
          check() {
            if [ -e "$1" ]; then echo "OK   $1"; else echo "MISS $1"; fail=1; fi
          }
          check deps/include
          check deps/libs
          check deps/frameworks
          check deps/resources/alpine-rootfs.zip
          check deps/frameworks/FFmpeg.xcframework
          check deps/frameworks/Rclone.xcframework
          if [ "$fail" != "0" ]; then
            echo "::error::原生依赖不完整，继续编只会得到一堆 undefined symbol。"
            exit 1
          fi
          du -sh deps/libs deps/include deps/frameworks deps/resources

      # ── 5. 生成构建期配置文件 ──
      # BUILDING.md 明确写了这两个文件不入库，构建前从 .example 复制。
      # 留空也能编 —— 只有用到对应功能的路径才需要在运行时补值。
      - name: Prepare build config
        run: |
          cp -v src/ios/Configs/ProviderCustomization.xcconfig.example \
                src/ios/Configs/ProviderCustomization.xcconfig || true
          ls -la src/ios/Configs/

      # ── 6. 编译 ──
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -derivedDataPath "$DERIVED" 2>&1 | tail -40

      - name: Build
        id: build
        run: |
          # 注意 flag 形态：
          #   -allowProvisioningUpdates 是开关，不能带值 —— 写成 "... NO" 会让
          #   xcodebuild 把 NO 当成 build action，直接报
          #   "xcodebuild: error: Unknown build action 'NO'."
          #   我们要的是"不做自动签名"，所以这个开关根本不加。
          #   CODE_SIGNING_ALLOWED=NO 这几个才是 key=value 形态。
          #
          # 内存控制：见文件顶部 env 里 BUILD_JOBS / SWIFT_DRIVER_JOBS /
          # SWIFT_COMPILATION_MODE 三条的说明。-jobs 只压构建任务数，
          # 压不住一个任务内部并行起的多个 swift-frontend，所以还要
          # SWIFT_DRIVER_JOBS 兜底（这条是 run #16 被 OOM 杀掉后补的）。
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -jobs "$BUILD_JOBS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log | tail -100

      # ── 7. 收集产物：同时出 .app zip 和 .ipa ──
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          APP=$(find "$DERIVED/Build/Products" -maxdepth 3 -name "*.app" -type d 2>/dev/null | head -1 || true)

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::warning::没找到 .app，构建大概失败了，看 build.log"
            echo "app not found" > out/BUILD-INFO.txt
            cp build.log out/ 2>/dev/null || true
            exit 0
          fi

          echo "found: $APP"
          BASE=$(basename "$APP" .app)
          echo "bundle: $BASE"

          # —— 先确认 .app 是完整的，再读身份 ——
          #
          # 为什么必须查：构建被 OOM 掐掉时，.app 目录已经建出来了，
          # 但 Info.plist 还没写。此时 PlistBuddy 会把
          #   "File Doesn't Exist, Will Create: <path>"
          # 打到 **stdout**（不是 stderr！），`2>/dev/null` 拦不住，
          # 于是这串错误文字被赋值给 $BUNDLE_ID / $SHORT_VER，
          # 一路污染到 ipa 文件名，最后 zip 报
          #   "Could not create output file (...-File Doesn't Exist...)"
          # ——症状看着像打包脚本的 bug，其实是编译没编完。
          # run #16 就是这么死的。
          PLIST="$APP/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::$APP 里没有 Info.plist，说明编译没跑完（大概率 OOM 被杀）。看 build.log 里的 'Failed frontend command'"
            echo "app incomplete (no Info.plist)" > out/BUILD-INFO.txt
            cp build.log out/ 2>/dev/null || true
            exit 1
          fi

          # PlistBuddy 读不到某个键时返回非零，此时用默认值。
          # 这里显式把 stderr 也丢掉，并二次校验输出里不含 "Doesn't Exist"
          # —— 双重保险，避免错误串再次污染文件名。
          pb() {
            local key="$1" dflt="$2" v
            v=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null) || v=""
            case "$v" in
              *"Doesn't Exist"*|*Error*) v="" ;;
            esac
            printf '%s' "${v:-$dflt}"
          }
          BUNDLE_ID=$(pb CFBundleIdentifier "?")
          DISPLAY_NAME=$(pb CFBundleDisplayName "?")
          SHORT_VER=$(pb CFBundleShortVersionString "1.0")
          BUILD_VER=$(pb CFBundleVersion "1")
          MIN_OS=$(pb MinimumOSVersion "?")
          EXEC_NAME=$(pb CFBundleExecutable "$BASE")

          echo "bundle-id  : $BUNDLE_ID"
          echo "display    : $DISPLAY_NAME"
          echo "version    : $SHORT_VER ($BUILD_VER)"
          echo "min-os     : $MIN_OS"

          # —— 1) 未签名 .app（TrollStore / 自签工具直接吃）——
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/${BASE}-unsigned.zip"

          # —— 2) .ipa：Payload/<App>.app 的 zip，ipa 就这个结构 ——
          # 未签名的 ipa 不能直装，但自签工具（Sideloadly / AltStore / ESign）
          # 和 TrollStore 都认这个形态，比自己把 zip 改后缀靠谱。
          IPA_DIR=$(mktemp -d)
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/"
          IPA_NAME="${BASE}-${SHORT_VER}-unsigned.ipa"
          ( cd "$IPA_DIR" && zip -qry "$OLDPWD/out/$IPA_NAME" Payload )
          rm -rf "$IPA_DIR"
          echo "ipa: out/$IPA_NAME"

          # —— 3) 关键校验：确认打出来的确实是共存版 ——
          echo "signed       = no (CODE_SIGNING_ALLOWED=NO)" > out/BUILD-INFO.txt
          {
            echo "app          = $BASE"
            echo "display-name = $DISPLAY_NAME"
            echo "bundle-id    = $BUNDLE_ID"
            echo "version      = $SHORT_VER ($BUILD_VER)"
            echo "min-os       = $MIN_OS"
            echo "executable   = $EXEC_NAME"
            echo "configuration= $CONFIG"
            echo "commit       = ${{ github.sha }}"
            echo "run          = ${{ github.run_number }}"
            echo "note         = ${{ inputs.note }}"
          } >> out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt

          # 身份不对就让这一步真的红。
          # 原来只 echo ::error:: 不 exit —— GitHub 会把 ::error:: 标红，
          # 但步骤退出码仍是 0，于是「红着成功」，artifact 照样传上去，
          # 很容易误以为没问题。现在是硬失败。
          if [ "$BUNDLE_ID" != "com.vipios.app" ]; then
            echo "::error::Bundle ID 是 $BUNDLE_ID，不是 com.vipios.app，装的会和原版冲突"
            cp build.log out/ 2>/dev/null || true
            exit 1
          fi

          # ipa 至少要能解开、里面有可执行文件，否则就是空壳
          if ! unzip -l "out/$IPA_NAME" | grep -q "Payload/$BASE.app/$EXEC_NAME"; then
            echo "::error::ipa 里找不到可执行文件 Payload/$BASE.app/$EXEC_NAME，包是空壳"
            exit 1
          fi
          echo "OK ipa 内含可执行文件 $EXEC_NAME"

          cp build.log out/ 2>/dev/null || true
          ls -lh out/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quanneng-ai-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: warn

      # ── 8. 汇总，失败时一眼看出挂在哪 ──
      - name: Summary
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 结论 | ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }} |"
            echo "| 配置 | \`$CONFIG\` |"
            echo "| 运行号 | ${{ github.run_number }} |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| 说明 | ${{ inputs.note || '（无）' }} |"
            echo ""

            if [ -f out/BUILD-INFO.txt ]; then
              echo "### 产物身份"
              echo ""
              echo '```'
              cat out/BUILD-INFO.txt
              echo '```'
              echo ""
              echo "### 文件"
              echo ""
              echo '```'
              ls -lh out/ | grep -v '^total'
              echo '```'
              echo ""
            fi

            echo "### 怎么装"
            echo ""
            echo "编译用 \`CODE_SIGNING_ALLOWED=NO\`，所以产物是**未签名**的："
            echo ""
            echo "| 文件 | 用途 |"
            echo "|---|---|"
            echo "| \`*.ipa\` | 自签工具直接用（Sideloadly / AltStore / ESign / TrollStore） |"
            echo "| \`*-unsigned.zip\` | 解出来就是 \`.app\`，TrollStore 或改包工具用 |"
            echo ""
            echo "未签名不能直接双击装 —— iOS 要有效签名。TrollStore 支持的系统可免签名安装，"
            echo "其余走自签：重签后 bundle id 保持 \`com.vipios.app\` 才能和原版共存。"
          } >> "$GITHUB_STEP_SUMMARY"
